name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend_tests:
    name: Backend Tests and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -f backend/online_teaching_platform -DskipTests=false test

      - name: Run backend package
        run: mvn -f backend/online_teaching_platform -DskipTests package

  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend build
        run: npm --prefix frontend run build

  backend_docker_smoke:
    name: Backend Docker Smoke Build
    runs-on: ubuntu-latest
    needs:
      - backend_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend Docker image
        run: docker build -t otp-backend-ci backend/online_teaching_platform

  frontend_docker_smoke:
    name: Frontend Docker Smoke Build
    runs-on: ubuntu-latest
    needs:
      - frontend_build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build frontend Docker image
        run: docker build --build-arg VITE_API_BASE_URL="" -t otp-frontend-ci frontend

  publish_backend_image:
    name: Publish Backend Image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - backend_docker_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/online_teaching_platform
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/online-teaching-platform-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/online-teaching-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_frontend_image:
    name: Publish Frontend Image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - frontend_build
      - frontend_docker_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: |
            VITE_API_BASE_URL=
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/online-teaching-platform-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/online-teaching-platform-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy_production:
    name: Deploy to DigitalOcean Droplet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - publish_backend_image
      - publish_frontend_image

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || '22' }}
          script: |
            cd /opt/onlineteaching
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d backend frontend
            docker compose --env-file .env.prod -f docker-compose.prod.yml restart nginx
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps
            docker image prune -f