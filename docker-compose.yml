# ====================================================================
# Online Teaching Platform - local docker-compose stack (Phase 1)
# Runs the whole app on http://localhost via Nginx reverse proxy.
# Production (TLS + certbot) lives in a future docker-compose.prod.yml.
# ====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [otp]

  backend:
    build:
      context: ./backend/online_teaching_platform
    image: otp-backend:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Ulaanbaatar
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ulaanbaatar
      DB_URL:                       ${DB_URL}
      DB_USER:                      ${DB_USER}
      DB_PASSWORD:                  ${DB_PASSWORD}
      JWT_SECRET:                   ${JWT_SECRET}
      JWT_TTL_MINUTES:              ${JWT_TTL_MINUTES}
      APP_CORS_ALLOWED_ORIGINS:     ${APP_CORS_ALLOWED_ORIGINS}
      CLOUDINARY_CLOUD_NAME:        ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:           ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:        ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER:            ${CLOUDINARY_FOLDER}
      CLOUDINARY_PROFILE_FOLDER:    ${CLOUDINARY_PROFILE_FOLDER}
      CLOUDINARY_UPLOAD_PRESET:     ${CLOUDINARY_UPLOAD_PRESET:-}
      CLOUDINARY_PROFILE_UPLOAD_PRESET: ${CLOUDINARY_PROFILE_UPLOAD_PRESET:-}
    depends_on:
      db:
        condition: service_healthy
    # bash /dev/tcp is built-in (no curl/wget needed in the JRE image).
    # Succeeds as soon as Spring Boot binds port 8080, i.e. app is up.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [otp]

  frontend:
    build:
      context: ./frontend
      args:
        # Empty -> SPA uses relative URLs -> Nginx routes /api/** to backend.
        VITE_API_BASE_URL: ""
    image: otp-frontend:local
    restart: unless-stopped
    networks: [otp]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [otp]

volumes:
  db_data:

networks:
  otp:
    driver: bridge
