spring:
  application:
    name: online_teaching_platform
  jackson:
    time-zone: Asia/Ulaanbaatar
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/OnlineTeachingPlatform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    # Hibernate-created DBs have no flyway_schema_history; baseline then run V10+ repairs only.
    baseline-on-migrate: true
    baseline-version: 9
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    org.flywaydb: INFO

server:
  port: 8080

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dwfb98ftt}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:subjectFiles}
  upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
  profile-folder: ${CLOUDINARY_PROFILE_FOLDER:profiles}
  profile-upload-preset: ${CLOUDINARY_PROFILE_UPLOAD_PRESET:}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret-change-me}
    accessTokenTtlMinutes: ${JWT_TTL_MINUTES:120}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
