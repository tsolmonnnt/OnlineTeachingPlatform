# ====================================================================
# Online Teaching Platform - production stack
# Pulls frontend/backend images from GHCR, serves the app from
# https://onlineteaching.dev, and runs PostgreSQL on the droplet.
# ====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - otp

  backend:
    image: ghcr.io/${GHCR_OWNER}/online-teaching-platform-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Ulaanbaatar
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ulaanbaatar
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-subjectFiles}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-profiles}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
      CLOUDINARY_PROFILE_UPLOAD_PRESET: ${CLOUDINARY_PROFILE_UPLOAD_PRESET:-}
    depends_on:
      - db
    networks:
      - otp

  frontend:
    image: ghcr.io/${GHCR_OWNER}/online-teaching-platform-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - otp

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/${NGINX_CONF_FILE:-prod-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - otp

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

volumes:
  db_data:
  letsencrypt:
  certbot_webroot:

networks:
  otp:
    driver: bridge
